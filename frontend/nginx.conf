# 客户端真实 IP：前面还有一层反向代理（生产的宿主 nginx 会设置 X-Real-IP）时沿用，否则取直连地址。
# 后端只在请求来自内网地址时才信任该头，用于登录失败按 IP 限流。
map $http_x_real_ip $kb_client_ip { "" $remote_addr; default $http_x_real_ip; }
server {
  listen 80;
  client_max_body_size 60m;
  # Docker 内置 DNS：后端容器重建后自动更新 IP；用别名 ai-kb-api，和 compose 服务名解耦
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $backend http://ai-kb-api:8080;
  # pdf.js 的 worker 是 .mjs 文件，nginx 默认类型表没有它，会返回 octet-stream，
  # 浏览器拒绝加载模块脚本，导致“原文查看”打不开。这里补上类型（types 会覆盖默认表，所以先 include）
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }
  location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $kb_client_ip;
    proxy_buffering off;          # 流式输出必需
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
