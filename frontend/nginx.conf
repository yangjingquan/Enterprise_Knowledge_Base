server {
  listen 80;
  client_max_body_size 20m;
  resolver 127.0.0.11 valid=10s;   # Docker 内置 DNS，后端容器重建后自动更新 IP
  set $backend http://backend-java:8080;
  # pdf.js 的 worker 是 .mjs 文件，nginx 默认类型表没有它，会返回 octet-stream，
  # 浏览器拒绝加载模块脚本，导致“原文查看”打不开。这里补上类型（types 会覆盖默认表，所以先 include）
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }
  location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_buffering off;          # 流式输出必需
    proxy_read_timeout 180s;
  }
}
