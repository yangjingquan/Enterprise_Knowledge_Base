server: { port: 8080 }
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kb}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:kb}
    password: ${DB_PASS:kb123}
  mvc: { async: { request-timeout: 180000 } }
  servlet: { multipart: { max-file-size: 20MB, max-request-size: 20MB } }
kb:
  upload-dir: ${UPLOAD_DIR:../uploads}
  rag-url: ${RAG_URL:http://localhost:8000}
  jwt-secret: ${JWT_SECRET:change-me-to-a-long-random-secret-key-0123456789}
