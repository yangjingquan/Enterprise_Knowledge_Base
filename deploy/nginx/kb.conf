# kb.nexbyte.top —— 企业 AI 知识库（由 Jenkins 任务 ai-kb-deploy 维护，加载于 shop-nginx 的 443）
server {
    listen 443 ssl;
    server_name kb.nexbyte.top;

    ssl_certificate     /etc/nginx/ssl/kb.nexbyte.top.pem;
    ssl_certificate_key /etc/nginx/ssl/kb.nexbyte.top.key;

    client_max_body_size 60m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # 运行时解析容器别名：ai-kb 容器不存在时不影响 shop-nginx，只会让本站返回 502
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $ai_kb_web ai-kb-web;
        proxy_pass http://$ai_kb_web:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 问答是流式输出（SSE），必须关闭缓冲并放宽超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
